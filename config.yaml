categories:
  private-domain:
    family: domain
    sources: [skk_lan]
    formats: [yaml, json, srs, mrs]
  private-ip:
    family: ipcidr
    sources: [private]
    formats: [yaml, json, srs, mrs]
  reject-domain:
    family: domain
    sources: [xndeye_reject]
    formats: [yaml, json, srs, mrs]
  reject-ip:
    family: ipcidr
    sources: [skk_reject_ip]
    formats: [yaml, json, srs, mrs]
  cn-domain:
    family: domain
    sources: [skk_domestic, geosite_cn, cloudflare@cn]
    formats: [yaml, json, srs, mrs]
  cn-ip:
    family: ipcidr
    sources: [skk_domestic_ip, skk_china_ip, skk_china_ipv6, geoip_cn]
    formats: [yaml, json, srs, mrs]
  microsoft-cn-domain:
    family: domain
    sources: [skk_microsoft_cdn, DustinWin_microsoft_cn, local_microsoft_cn]
    formats: [yaml, json, srs, mrs]
  apple-cn-domain:
    family: domain
    sources: [skk_apple_services, skk_apple_cn, skk_apple_cdn, DustinWin_apple_cn]
    formats: [yaml, json, srs, mrs]
  steam-cn-domain:
    family: domain
    sources: [blackmatrix7_steam_cn]
    formats: [yaml, json, srs, mrs]
  ai-domain:
    family: domain
    sources: [skk_ai, DustinWin_ai, ACL4SSR_ai, local_ai]
    formats: [yaml, json, srs, mrs]
  streaming-domain:
    family: domain
    sources: [skk_stream, skk_biliintl]
    formats: [yaml, json, srs, mrs]
  streaming-ip:
    family: ipcidr
    sources: [skk_stream_ip]
    formats: [yaml, json, srs, mrs]
  telegram-domain:
    family: domain
    sources: [telegram]
    formats: [yaml, json, srs, mrs]
  telegram-ip:
    family: ipcidr
    sources: [skk_telegram_ip]
    formats: [yaml, json, srs, mrs]
  gfw-domain:
    family: domain
    sources: [gfw]
    formats: [yaml, json, srs, mrs]
  global-domain:
    family: domain
    sources: [skk_global]
    formats: [yaml, json, srs, mrs]
  bytedance-non-cn-domain:
    family: domain
    sources: [bytedance@!cn]
    formats: [yaml, json, srs, mrs]
  custom-direct-domain:
    family: domain
    sources: [skk_direct, xndeye_direct]
    formats: [yaml, json, srs, mrs]
  custom-proxy-domain:
    family: domain
    sources: [xndeye_proxy]
    formats: [yaml, json, srs, mrs]
  cdn-domain:
    family: domain
    sources: [skk_cdn_domainset, skk_cdn]
    formats: [yaml, json, srs, mrs]
  cdn-ip:
    family: ipcidr
    sources: [skk_cdn_ip]
    formats: [yaml, json, srs, mrs]
  download-domain:
    family: domain
    sources: [skk_download_domainset, skk_download]
    formats: [yaml, json, srs, mrs]
  google-cn-domain:
    family: domain
    sources: [google_cn]
    formats: [yaml, json, srs, mrs]
  fakeip-filter-domain:
    family: domain
    sources: [skk_fake_ip_filter]
    formats: [yaml, json, srs, mrs]

profiles:
  default:
    actions:
      direct-domain: [private-domain, cn-domain, microsoft-cn-domain, apple-cn-domain, steam-cn-domain, custom-direct-domain]
      direct-ip: [private-ip, cn-ip]
      reject-domain: [reject-domain]
      reject-ip: [reject-ip]
      proxy-domain: [gfw-domain, global-domain, ai-domain, streaming-domain, telegram-domain, bytedance-non-cn-domain, custom-proxy-domain]
      proxy-ip: [streaming-ip, telegram-ip]
    formats: [yaml, json, srs, mrs]

overrides: local/overrides.yaml

quality:
  max_drop_ratio: 0.15
  max_growth_ratio: 0.50
  small_output_limit: 100
  min_rules: {}
  # Every emitted output below small_output_limit must be listed here.
  # One extension-free path covers its YAML, JSON, SRS, and MRS variants.
  critical_rules:
    categories/private-domain: ["DOMAIN-SUFFIX,lan"]
    categories/private-ip: ["IP-CIDR,10.0.0.0/8"]
    categories/steam-cn-domain: ["DOMAIN,csgo.wmsj.cn"]
    categories/streaming-ip: ["IP-CIDR,23.246.18.0/23"]
    categories/telegram-domain: ["DOMAIN-SUFFIX,t.me"]
    categories/telegram-ip: ["IP-CIDR,91.105.192.0/23"]
    categories/bytedance-non-cn-domain: ["DOMAIN-SUFFIX,byteglb.com"]
    categories/custom-proxy-domain: ["DOMAIN-SUFFIX,steam-chat.com"]
    categories/cdn-ip: ["IP-CIDR,162.159.200.1/32"]
    categories/fakeip-filter-domain: ["DOMAIN-SUFFIX,lan"]
    profiles/default/proxy-ip: ["IP-CIDR,23.246.18.0/23"]

legacy:
  enabled: true
  aliases:
    reject: profiles/default/reject-domain
    reject@ip: profiles/default/reject-ip
    direct: profiles/default/direct-domain
    direct@ip: profiles/default/direct-ip
    microsoft@cn: categories/microsoft-cn-domain
    apple@cn: categories/apple-cn-domain
    steam@cn: categories/steam-cn-domain
    ai: categories/ai-domain
    proxy: profiles/default/proxy-domain
    proxy@ip: profiles/default/proxy-ip
    lan: categories/private-domain
    lan@ip: categories/private-ip
    fakeip-filter: categories/fakeip-filter-domain
