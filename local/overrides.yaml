# Only list deliberate exceptions here. The more specific rule is removed from
# ordinary profile sets and emitted as an early override artifact.
force_direct: []
force_reject: []
# Google notification links must remain reachable (reviewed 2026-11-07).
# Match the upstream suffix rule so it is removed from normal reject profiles.
force_proxy:
  - DOMAIN-SUFFIX,notifications.googleapis.com
